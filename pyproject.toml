[project]
name = "curso-python-smart-finance"
version = "0.1.0"
description = "Curso de Python Smart Finance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.0.1",
    "django-browser-reload==1.18.0",
    "django-cors-headers>=4.9.0",
    "django-tailwind==4.0.1",
    "djangorestframework>=3.17.1",
    "groq>=1.5.0",
    "pillow>=12.2.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "cookiecutter",
    "coverage==7.6.12",
    "djlint==1.36.4",
    "pre-commit==3.4.0",
    "pytest==8.0.0",
    "pytest-django>=4.12.0",
    "ruff==0.14.10",
]
