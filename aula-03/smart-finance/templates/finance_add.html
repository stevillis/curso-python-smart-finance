{% extends 'base.html' %}
{% block title %}Nova Transação - SmartFinance{% endblock %}
{% block content %}
    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-10">
        <h1 class="text-[2rem] font-medium tracking-tight">Registrar Movimentação</h1>
    </div>
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-6 md:p-8 shadow-sm transition-colors duration-300 ease-in-out min-w-0 max-w-[600px] w-full">
        <form method="POST" action="{% url 'finance:add' %}" class="flex flex-col gap-6">
            {% csrf_token %}
            <div class="flex flex-col gap-1.5">
                <label class="text-[0.9rem] font-semibold text-slate-700 dark:text-slate-300">Descrição</label>
                <input type="text"
                       name="description"
                       class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-md py-2.5 px-3 text-[0.95rem] text-slate-900 dark:text-slate-50 outline-none transition-colors duration-200 w-full focus:border-teal-600 dark:focus:border-teal-500 font-sans"
                       required
                       placeholder="Ex: Salário, Supermercado...">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[0.9rem] font-semibold text-slate-700 dark:text-slate-300">Valor (R$)</label>
                <input type="number"
                       step="0.01"
                       name="amount"
                       class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-md py-2.5 px-3 text-[0.95rem] text-slate-900 dark:text-slate-50 outline-none transition-colors duration-200 w-full focus:border-teal-600 dark:focus:border-teal-500 font-sans"
                       required
                       placeholder="0.00">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[0.9rem] font-semibold text-slate-700 dark:text-slate-300">Data</label>
                <input type="date" name="date" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-md py-2.5 px-3 text-[0.95rem] text-slate-900 dark:text-slate-50 outline-none transition-colors duration-200 w-full focus:border-teal-600 dark:focus:border-teal-500 font-sans [color-scheme:light] dark:[color-scheme:dark]" required>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[0.9rem] font-semibold text-slate-700 dark:text-slate-300">Categoria</label>
                <select name="category" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-md py-2.5 px-3 text-[0.95rem] text-slate-900 dark:text-slate-50 outline-none cursor-pointer transition-colors duration-200 w-full focus:border-teal-600 dark:focus:border-teal-500 font-sans" required>
                    <option value="Salário">Salário</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[0.9rem] font-semibold text-slate-700 dark:text-slate-300">Tipo de Movimentação</label>
                <div class="flex items-center gap-6 mt-1">
                    <label class="flex items-center gap-2 text-[0.95rem] text-slate-700 dark:text-slate-300 cursor-pointer">
                        <input type="radio" name="type" value="receita" class="w-4 h-4 text-teal-600 dark:text-teal-500 bg-slate-50 dark:bg-slate-950 border-slate-300 dark:border-slate-700 focus:ring-teal-500 dark:focus:ring-teal-600 focus:ring-2 cursor-pointer" required>
                        Receita
                    </label>
                    <label class="flex items-center gap-2 text-[0.95rem] text-slate-700 dark:text-slate-300 cursor-pointer">
                        <input type="radio" name="type" value="despesa" class="w-4 h-4 text-teal-600 dark:text-teal-500 bg-slate-50 dark:bg-slate-950 border-slate-300 dark:border-slate-700 focus:ring-teal-500 dark:focus:ring-teal-600 focus:ring-2 cursor-pointer" required>
                        Despesa
                    </label>
                </div>
            </div>
            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white py-3.5 px-5 rounded-md font-medium text-[0.95rem] transition-colors duration-150 flex items-center justify-center gap-2 shadow-sm w-full mt-2 cursor-pointer border-none">Salvar Transação</button>
        </form>
    </div>
{% endblock %}
