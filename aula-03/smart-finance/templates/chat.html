{% extends 'base.html' %}
{% block title %}Assistente IA - SmartFinance AI{% endblock %}
{% block content %}
    <div class="topbar">
        <h1 class="page-title">
            <i class="fa-solid fa-robot" style="color: var(--accent-blue);"></i> Assistente Financeiro IA
        </h1>
    </div>
    <div class="card chat-container">
        <div class="chat-messages" id="chat-messages">
            <div class="message msg-ai">
                <strong>Agente Financeiro IA</strong>
                <br>
                Olá! Eu sou o seu Assistente Financeiro IA. Como posso ajudar com suas finanças hoje?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text"
                   id="chat-input"
                   class="chat-input"
                   placeholder="Pergunte sobre seus gastos, peça dicas de economia...">
            <button id="chat-send-btn" class="btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Enviar
            </button>
        </div>
    </div>
    <script id="chat-config" type="application/json">
    {
        "apiUrl": "{% url 'intelligence:chat_api' %}",
        "csrfToken": "{{ csrf_token }}",
        "aiName": "Agente Financeiro IA",
        "reloadOnTransaction": false
    }
    </script>
{% endblock %}
{% block extra_js %}<script src="/static/js/chat.js"></script>{% endblock %}
